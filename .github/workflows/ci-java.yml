name: CI (Java)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      - name: 赋予 mvnw 执行权限
        run: chmod +x java/mvnw
      - name: 单元测试与 API 测试
        working-directory: java
        run: ./mvnw -B test
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: surefire-reports, path: java/target/surefire-reports/ }

  e2e:
    needs: unit-and-api           # 单元测试通过后才运行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      - name: 赋予 mvnw 执行权限
        run: chmod +x java/mvnw
      - name: 打包并后台启动网站
        working-directory: java
        run: |
          ./mvnw -B -q package -DskipTests
          java -jar target/campusshop-1.0.0.jar &
      - name: 等待网站就绪
        run: for i in $(seq 1 30); do curl -sf localhost:8080 && break; sleep 2; done
      - name: 安装浏览器
        working-directory: java
        run: ./mvnw -B -q exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"
      - name: E2E 测试
        working-directory: java
        run: ./mvnw -B test -Pe2e
      - name: 失败时上传 Trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: java/traces/
