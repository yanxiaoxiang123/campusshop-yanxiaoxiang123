<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('购物车')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>购物车</h1>
    <div class="info" th:if="${placedOrder}">下单成功，订单号：<span data-testid="order-no"
            th:text="'CS' + ${placedOrder.id}">CS5002</span></div>
    <div class="error" data-testid="error-msg" th:if="${error}" th:text="${error}"></div>
    <p th:if="${cart.empty}">购物车为空</p>
    <th:block th:unless="${cart.empty}">
        <table class="cart">
            <thead>
            <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.items}">
                <td th:text="${item.name}"></td>
                <td th:text="'¥' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="'¥' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
            </tr>
            </tbody>
        </table>
        <p th:text="'原价合计：¥' + ${#numbers.formatDecimal(cart.subtotal, 1, 2)}"></p>
    </th:block>
    <p>商品件数：<span data-testid="cart-count" th:text="${itemCount}">0</span> 件</p>
    <p>运费：<span data-testid="cart-shipping"
            th:text="${freeShipping ? '免运费' : '¥' + #numbers.formatDecimal(shipping, 1, 2)}">免运费</span></p>
    <p>应付金额：<span data-testid="cart-total" th:text="'¥' + ${#numbers.formatDecimal(total, 1, 2)}">¥0.00</span></p>
    <form method="post" action="/cart">
        <button type="submit" th:disabled="${cart.empty}">提交订单</button>
    </form>
</main>
</body>
</html>
