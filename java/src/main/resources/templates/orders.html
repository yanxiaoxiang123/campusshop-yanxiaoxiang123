<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('我的订单')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>我的订单</h1>
    <p th:if="${#lists.isEmpty(orders)}">还没有订单</p>
    <table th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr><th>订单号</th><th>商品</th><th>应付金额</th><th>运费</th><th>下单时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="'CS' + ${o.id}"></td>
            <td><span th:each="i, st : ${o.items}" th:text="${i.name} + ' × ' + ${i.quantity} + (${st.last} ? '' : '，')"></span></td>
            <td th:text="'¥' + ${#numbers.formatDecimal(o.total, 1, 2)}"></td>
            <td th:text="${o.shipping.signum() == 0 ? '免运费' : '¥' + #numbers.formatDecimal(o.shipping, 1, 2)}">免运费</td>
            <td th:text="${#temporals.format(o.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
